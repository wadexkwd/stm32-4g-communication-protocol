<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 应急跌落事件监控系统</title>
    <link rel="stylesheet" href="css/style.css?v=20260825">
    <script src="vendor/vue.global.prod.js?v=20260825"></script>
</head>
<body class="login-body">
    <div id="app" v-cloak>
        <form class="login-box" @submit.prevent="doLogin">
            <div class="login-title">应急跌落事件监控系统</div>
            <div class="login-sub">请输入访问密码</div>
            <input type="password" v-model="password" placeholder="密码" autofocus
                   :disabled="loading" @input="error=''">
            <div class="login-error" v-if="error">{{ error }}</div>
            <button type="submit" class="btn primary login-btn" :disabled="loading || !password">
                {{ loading ? '登录中...' : '登 录' }}
            </button>
        </form>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const password = ref('');
                const error = ref('');
                const loading = ref(false);

                async function doLogin() {
                    if (!password.value) return;
                    loading.value = true;
                    error.value = '';
                    try {
                        const resp = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: password.value }),
                        });
                        if (resp.ok) {
                            location.href = '/';
                            return;
                        }
                        const data = await resp.json().catch(() => ({}));
                        error.value = resp.status === 401 ? '密码错误' : `登录失败 (${resp.status})`;
                    } catch (e) {
                        error.value = '网络错误，请稍后重试';
                    } finally {
                        loading.value = false;
                    }
                }

                return { password, error, loading, doLogin };
            },
        }).mount('#app');
    </script>
</body>
</html>
