<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物联设备开发测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(160deg, #1b2a4a 0%, #24395f 55%, #1f3357 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            flex-direction: column;
        }
        .hero {
            text-align: center;
            padding: 64px 20px 40px;
            color: #fff;
        }
        .hero h1 {
            font-size: 34px;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 16px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.82);
            max-width: 640px;
            margin: 0 auto;
        }
        .main {
            flex: 1;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 20px 60px;
        }
        .section-title {
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            margin: 20px 0 14px;
            letter-spacing: 1px;
        }
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 26px 24px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            display: block;
            text-decoration: none;
            color: #333;
            transition: transform .15s, box-shadow .15s;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }
        .card .name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .card .desc {
            font-size: 13.5px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 14px;
        }
        .card .enter {
            font-size: 13px;
            color: #1a66b3;
            font-weight: bold;
        }
        .card .lock {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 12px;
            color: #b8860b;
            background: #fdf6e3;
            border: 1px solid #f0e0b0;
            border-radius: 10px;
            padding: 2px 10px;
        }
        .card.placeholder {
            background: rgba(255, 255, 255, 0.08);
            border: 1px dashed rgba(255, 255, 255, 0.35);
            box-shadow: none;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
        }
        .card.placeholder .name { color: rgba(255, 255, 255, 0.6); }
        footer {
            text-align: center;
            padding: 18px;
            font-size: 12.5px;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.45);
        }
        footer a {
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
        }
        footer a:hover {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>物联设备开发测试</h1>
        <p>本网站用于物联网设备的开发与测试，包括设备数据实时监测、历史数据查询、指令下发测试等，是各物联网项目的统一部署与展示入口。</p>
    </div>

    <div class="main">
        <div class="section-title">项目列表</div>
        <div class="projects">
            <a class="card" href="/monitor">
                <span class="lock">🔒 密码访问</span>
                <div class="name">应急跌落事件监控系统</div>
                <div class="desc">铁塔作业人员安全监控：传感器数据实时展示（加速度/姿态/气压/定位）、历史查询与导出、设备数据看板、数据保留策略管理。</div>
                <div class="enter">点击进入 →</div>
            </a>
            <div class="card placeholder">
                <div class="name">更多项目</div>
                <div class="desc">后续物联网项目将陆续部署到此服务器</div>
            </div>
        </div>
    </div>

    <footer>
        <div>物联网设备开发测试公共服务 · 部署于阿里云</div>
        <div><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">蜀ICP备2026049245号</a></div>
    </footer>
</body>
</html>
